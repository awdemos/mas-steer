[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Andrew White <hello@neuronengineering.dev>"]
license = "MIT"
repository = "https://github.com/awdemos/mas-steer"
rust-version = "1.75"

[workspace.dependencies]
# core
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# concurrency
rayon = "1.10"

# cli
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
toml = "0.8"

# optional ML backend (disabled by default to keep compile fast)
candle-core = "0.11"

# dev
proptest = "1.5"
tempfile = "3.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
